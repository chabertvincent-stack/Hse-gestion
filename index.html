function defaultDuerpConfig(){return{criteria:[
 {key:'gravity',name:'Gravité',active:true,levels:['Faible','Moyen','Grave','Très grave','','','','']},
 {key:'exposureFrequency',name:'Fréquence / Exposition',active:true,levels:['Rare','Occasionnelle','Fréquente','Permanente','','','','']},
 {key:'mastery',name:'Maîtrise',active:true,levels:['Totalement maîtrisé','Partiellement maîtrisé','Non maîtrisé','Niveau 4','Niveau 5','Niveau 6','Niveau 7','Niveau 8']}
],zones:{green:{label:'Faible',min:1,max:25},orange:{label:'Moyen',min:26,max:100},red:{label:'Élevé',min:101,max:128}}}}
function normalizeDuerpConfig(raw){
 const d=defaultDuerpConfig(),x=raw||{};
 const src=Array.isArray(x.criteria)?x.criteria:[];
 d.criteria=d.criteria.map(def=>{const saved=src.find(c=>String(c?.key)===def.key)||{};let n=Math.min(8,Math.max(1,Number(saved.levelCount)||((Array.isArray(saved.levels)?saved.levels.filter(Boolean).length:0)||def.levels.filter(Boolean).length)));let lv=Array.isArray(saved.levels)?saved.levels.slice(0,8):def.levels.slice();while(lv.length<8)lv.push('');for(let i=0;i<8;i++)if(!lv[i])lv[i]=`Niveau ${i+1}`;return{key:def.key,name:String(saved.name||def.name),active:saved.active!==false,levelCount:n,levels:lv.slice(0,8)}});
 const z=x.zones||{};const max=duerpMaxScoreFromConfig(d);const norm=(k,defMin,defMax)=>{const q=z[k]||{};return{label:String(q.label||(k==='green'?'Faible':k==='orange'?'Moyen':'Élevé')),min:Math.max(1,Math.min(max,Number(q.min)||defMin)),max:Math.max(1,Math.min(max,Number(q.max)||defMax))}};
 d.zones={green:norm('green',1,Math.min(25,max)),orange:norm('orange',Math.min(26,max),Math.min(100,max)),red:norm('red',Math.min(101,max),max)};
 return d;
}
function duerpActiveCriteria(config=db.duerpConfig){return(config?.criteria||[]).filter(c=>c.active&&Number(c.levelCount)>0)}
function duerpMaxScoreFromConfig(config){return Math.max(1,duerpActiveCriteria(config).reduce((n,c)=>n*Math.max(1,Number(c.levelCount)||1),1))}
function duerpMaxScore(){return duerpMaxScoreFromConfig(db.duerpConfig)}
function duerpCriterion(key){return(db.duerpConfig?.criteria||[]).find(c=>c.key===key)}
function duerpCriterionOptions(key,selected){const c=duerpCriterion(key);if(!c)return'';return Array.from({length:Number(c.levelCount)||0},(_,idx)=>{const v=String(idx+1);return `<option value="${v}" ${String(selected)===v?'selected':''}>${v} — ${esc(c.levels[idx]||`Niveau ${v}`)}</option>`}).join('')}
function duerpScore(gravity,frequency,mastery){const vals={gravity,exposureFrequency:frequency,mastery};const cs=duerpActiveCriteria();if(!cs.length)return'';const nums=cs.map(c=>Number(vals[c.key]));if(nums.some(n=>!Number.isFinite(n)||n<=0))return'';return nums.reduce((p,n)=>p*n,1)}
function duerpZone(score){const n=Number(score);if(!Number.isFinite(n)||n<=0)return null;const z=db.duerpConfig?.zones||{};for(const key of ['green','orange','red']){const q=z[key];if(q&&n>=Number(q.min)&&n<=Number(q.max))return{key,label:q.label,min:q.min,max:q.max}}return null}
function duerpLevel(score){return duerpZone(score)?.label||'Non coté'}
function duerpLevelKey(score){return duerpZone(score)?.key||''}
function duerpLevelClass(levelOrScore){if(['green','orange','red'].includes(levelOrScore))return levelOrScore==='red'?'red':levelOrScore==='orange'?'orange':'';const zone=typeof levelOrScore==='number'?duerpZone(levelOrScore):Object.values(db.duerpConfig?.zones||{}).find(z=>z?.label===levelOrScore);return zone?(Object.entries(db.duerpConfig?.zones||{}).find(([,z])=>z===zone)?.[0]==='red'?'red':Object.entries(db.duerpConfig?.zones||{}).find(([,z])=>z===zone)?.[0]==='orange'?'orange':''):''}
function duerpRiskPill(levelOrScore){const zone=typeof levelOrScore==='number'?duerpZone(levelOrScore):null;const label=zone?.label||(typeof levelOrScore==='string'?levelOrScore:'Non coté');const cls=zone?duerpLevelClass(zone.key):duerpLevelClass(label);return `<span class="pill ${cls}">${esc(label)}</span>`}
function duerpItemScore(i){const s=duerpScore(i.gravity,i.exposureFrequency,i.mastery);return s||i.riskScore||''}
function duerpItemActionIds(item){if(Array.isArray(item?.actionIds))return item.actionIds.filter(Boolean);return item?.actionId?[item.actionId]:[]}
function setDuerpItemActionIds(item,ids){const clean=[...new Set((ids||[]).filter(Boolean))];item.actionIds=clean;item.actionId=clean[0]||''}
function duerpGridSummary(){const cs=duerpActiveCriteria();return `${cs.length} critère(s) actif(s) • méthode : ${cs.map(c=>c.name).join(' × ')} • score maximal ${duerpMaxScore()}`}

function load(){
 try{
  let x=JSON.parse(localStorage.getItem('hsePilotageDB'))||{};
  const savedTypes=Array.isArray(x.vgpTypes)?x.vgpTypes:[];
  const typesMap=new Map(savedTypes.map(t=>[String(t.key||t.code||''),t]));
  defaultVgpTypes().forEach(t=>{if(!typesMap.has(t.key))typesMap.set(t.key,t)});
  const items=Array.isArray(x.items)?x.items:[];
  const actions=Array.isArray(x.actions)?x.actions:[];
  const units=[...new Set((Array.isArray(x.workUnits)?x.workUnits:[]).map(v=>String(v).trim()).filter(Boolean))];
  const personnel=[...new Set((Array.isArray(x.personnel)?x.personnel:[]).map(v=>String(v).trim()).filter(Boolean))];
  items.forEach(i=>{
    [i.workUnit,i.service,i.unit].forEach(v=>{if(v&&typeof v==='string'&&!units.includes(v))units.push(v)});
    [i.author,i.owner].forEach(v=>{if(v&&typeof v==='string'&&!personnel.includes(v))personnel.push(v)});
    if(i.module==='hazards' && i.reporter && !personnel.includes(i.reporter))personnel.push(i.reporter);
  });
  actions.forEach(a=>{
    if(a.owner&&!personnel.includes(a.owner))personnel.push(a.owner);
    if(a.unit&&!units.includes(a.unit))units.push(a.unit);
  });
  const result={
    items,actions,
    vgpReports:Array.isArray(x.vgpReports)?x.vgpReports:[],
    vgpFindings:Array.isArray(x.vgpFindings)?x.vgpFindings:[],
    vgpTypes:[...typesMap.values()],
    duerpConfig:normalizeDuerpConfig(x.duerpConfig),
    duerpExpandedUnits:(x.duerpExpandedUnits&&typeof x.duerpExpandedUnits==='object')?x.duerpExpandedUnits:{},
    chemicalProducts:Array.isArray(x.chemicalProducts)?x.chemicalProducts:items.filter(i=>i.module==='chemical').map(i=>normalizeChemicalProduct(i)),
    chemicalRequests:Array.isArray(x.chemicalRequests)?x.chemicalRequests:[],
    chemicalSettings:normalizeChemicalSettings(x.chemicalSettings),
    chemicalSeq:Math.max(1,Number(x.chemicalSeq)||1),
    chemicalRequestSeq:Math.max(1,Number(x.chemicalRequestSeq)||1),
    accidents:Array.isArray(x.accidents)?x.accidents:items.filter(i=>i.module==='accidents'),
    analysesAT:Array.isArray(x.analysesAT)?x.analysesAT:[],
    atSeqByYear:(x.atSeqByYear&&typeof x.atSeqByYear==='object')?x.atSeqByYear:{},
    analysisSeq:Math.max(1,Number(x.analysisSeq)||1),
    workUnits:units,
    personnel,
    seq:Number(x.seq)||1,
    papSeq:Math.max(1,Number(x.papSeq)||1),
    suSeqByYear:(x.suSeqByYear&&typeof x.suSeqByYear==='object')?x.suSeqByYear:{}
  };
  result.vgpTypes=result.vgpTypes.map(t=>({key:String(t.key||t.code||''),code:String(t.code||t.key||'').toUpperCase(),name:t.name||t.code||'VGP',icon:t.icon||vgpAutoIcon(t.name,t.code),desc:t.desc||('Rapports de contrôle '+(t.code||'')),periodicityMonths:Math.max(1,Number(t.periodicityMonths)||12),alertDays:Math.max(1,Number(t.alertDays)||30),system:!!t.system})).filter(t=>t.key);
  result.duerpConfig=normalizeDuerpConfig(result.duerpConfig);
  result.accidents=(result.accidents||[]).map(normalizeAccidentRecord);
  result.analysesAT=(result.analysesAT||[]).map(normalizeAccidentAnalysis);
  const atMax={...result.atSeqByYear};
  result.accidents.forEach(a=>{const y=yearFromDate(a.date||a.created),m=String(a.reference||'').match(new RegExp('^'+y+'-AT-(\\d+)$'));if(m)atMax[y]=Math.max(Number(atMax[y])||0,Number(m[1])+1);});
  Object.keys(atMax).forEach(y=>atMax[y]=Math.max(1,Number(atMax[y])||1));
  result.atSeqByYear=atMax;
  let analysisMax=Math.max(0,Number(result.analysisSeq)-1);
  result.analysesAT.forEach(a=>{const m=String(a.reference||'').match(/^ANA-AT-(\\d+)$/);if(m)analysisMax=Math.max(analysisMax,Number(m[1]));});
  result.analysisSeq=Math.max(Number(result.analysisSeq)||1,analysisMax+1);
  result.vgpReports=result.vgpReports.map(r=>{
    if(!r.vgpKey){
      const raw=String(r.reportType||'').trim().toUpperCase();
      const match=result.vgpTypes.find(t=>t.code===raw||t.key===raw);
      if(match)r.vgpKey=match.key;
    }
    return r;
  });
  // Migration : toutes les actions issues FA / urgence / DUERP restent des actions PAPRIPACT.
  result.actions.forEach(a=>{const o=String(a.origin||'');if(/DUERP|Fiche d’amélioration|Situation d’urgence|Situation dangereuse/i.test(o))a.papripact=true;});
  // Attribution de références PAPRIPACT stables aux anciennes actions.
  const pap=result.actions.filter(a=>a.papripact===true).slice().sort((a,b)=>String(a.created||'').localeCompare(String(b.created||'')));
  let maxPap=Math.max(0,Number(result.papSeq)-1);
  pap.forEach(a=>{
    const m=String(a.reference||'').match(/^PAP-(\d+)$/);
    if(m){a.reference=`PAP-${String(Number(m[1])).padStart(3,'0')}`;maxPap=Math.max(maxPap,Number(m[1]));}
  });
  pap.forEach(a=>{
    if(!/^PAP-\d+$/.test(String(a.reference||''))){maxPap++;a.reference=`PAP-${String(maxPap).padStart(3,'0')}`;}
  });
  result.papSeq=Math.max(Number(result.papSeq)||1,maxPap+1);
  // Migration des références SU annuelles : la prochaine référence ne réutilise jamais un numéro supprimé.
  const suMax={...result.suSeqByYear};

function sortableTextValue(text){
 const t=String(text||'').replace(/\s+/g,' ').trim();
 if(!t)return {type:'empty',value:''};
 const d=t.match(/^(\d{4})[-\/](\d{1,2})[-\/](\d{1,2})$/)||t.match(/^(\d{1,2})[\/](\d{1,2})[\/](\d{4})$/);
 if(d){
  const iso=d.length===4?`${d[1].padStart(4,'0')}-${d[2].padStart(2,'0')}-${d[3].padStart(2,'0')}`:`${d[3]}-${d[2].padStart(2,'0')}-${d[1].padStart(2,'0')}`;
  return {type:'date',value:iso};
 }
 const n=t.replace(/[^0-9,.-]/g,'').replace(/\s/g,'').replace(',','.');
 if(n && /^-?\d+(?:\.\d+)?$/.test(n))return {type:'number',value:Number(n)};
 return {type:'text',value:t.toLocaleLowerCase('fr',{sensitivity:'base'})};
}
function sortTableByColumn(table,colIndex,direction){
 const tbody=table.tBodies[0];if(!tbody)return;
 const rows=[...tbody.rows];
 rows.sort((a,b)=>{
  const av=sortableTextValue(a.cells[colIndex]?.innerText||'');
  const bv=sortableTextValue(b.cells[colIndex]?.innerText||'');
  if(av.type===bv.type){
   if(av.value<bv.value)return -1*direction;
   if(av.value>bv.value)return 1*direction;
   return 0;
  }
  if(av.type==='empty'&&bv.type!=='empty')return 1;
  if(bv.type==='empty'&&av.type!=='empty')return -1;
  const order={number:1,date:2,text:3};
  return ((order[av.type]||9)-(order[bv.type]||9))*direction;
 });
 rows.forEach(r=>tbody.appendChild(r));
 table.querySelectorAll('th.sortable').forEach(th=>{th.classList.remove('sort-asc','sort-desc')});
 const th=table.tHead?.rows[0]?.cells[colIndex];if(th)th.classList.add(direction===1?'sort-asc':'sort-desc');
}
function enhanceSortableTables(root=document){
 root.querySelectorAll('table').forEach((table,tableIndex)=>{
  const header=table.tHead?.rows?.[0];if(!header)return;
  [...header.cells].forEach((th,i)=>{
   if(!th.innerText.trim() || th.dataset.noSort==='true' || th.querySelector('input,button,select,textarea'))return;
   th.classList.add('sortable');th.title='Cliquer pour trier';
   if(th.dataset.sortReady==='1')return;
   th.dataset.sortReady='1';
   th.addEventListener('click',()=>{
    const currentDir=th.classList.contains('sort-asc')?1:th.classList.contains('sort-desc')?-1:0;
    const next=currentDir===1?-1:1;
    sortTableByColumn(table,i,next);
   });
  });
 });
}

ld"><label>CMR / danger particulier</label><select name="cmr"><option ${r.cmr==='Non'?'selected':''}>Non</option><option ${r.cmr==='Oui'?'selected':''}>Oui</option><option ${r.cmr==='À vérifier'?'selected':''}>À vérifier</option></select></div><div class="field"><label>Mentions H / danger</label><input name="hStatements" value="${esc(r.hStatements||'')}" placeholder="Hxxx…"></div><div class="field span4"><label>Substitution / alternative examinée</label><textarea name="substitutionComment" placeholder="Produit/procédé alternatif recherché, raison du choix…">${esc(r.substitutionComment||'')}</textarea></div><div class="field"><label>Substitution considérée ?</label><select name="substitutionConsidered"><option ${r.substitutionConsidered==='Oui'?'selected':''}>Oui</option><option ${r.substitutionConsidered==='Non'?'selected':''}>Non</option><option ${r.substitutionConsidered==='À étudier'?'selected':''}>À étudier</option></select></div><div class="field"><label>Stockage prévu</label><input name="storage" value="${esc(r.storage||'')}"></div><div class="field"><label>Protection collective</label><input name="collectiveProtection" value="${esc(r.collectiveProtection||'')}"></div><div class="field"><label>EPI prévus</label><input name="ppe" value="${esc(r.ppe||'')}"></div><div class="field span4"><label>Mesures / catégories de prévention à prévoir</label><select name="preventionCategory">${CHEMICAL_CATEGORIES.map(x=>`<option ${r.preventionCategory===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div><div class="field"><label>Statut de la demande</label><select name="status">${['À instruire','En analyse','Acceptée','Acceptée sous conditions','Refusée','Produite'].map(x=>`<option ${r.status===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>Décideur / valideur</label><select name="reviewer">${personOptions(r.reviewer||'')}</select></div><div class="field"><label>Date décision</label><input name="decisionDate" type="date" value="${esc(r.decisionDate||'')}"></div><div class="field span4"><label>Motif / conditions / observations</label><textarea name="comment">${esc(r.comment||'')}</textarea></div></div><div class="form-actions"><button type="button" class="btn" onclick="closeModal()">Annuler</button>${isEdit?`<button type="button" class="btn danger-fill" onclick="closeModal();deleteChemicalRequest('${r.id}')">Supprimer</button>`:''}<button class="btn primary">${isEdit?'Enregistrer les modifications':'Enregistrer la demande'}</button></div></form>`);document.getElementById('chemicalRequestForm').onsubmit=e=>{e.preventDefault();if(!lockFormSubmit(e.target))return;const f=new FormData(e.target),now=new Date().toISOString(),data={reference:isEdit?r.reference:chemicalRequestSeqNext(),requestDate:f.get('requestDate')||dateNow(),requester:f.get('requester')||'',unit:f.get('unit')||'',productName:f.get('productName')||'',manufacturer:f.get('manufacturer')||'',supplier:f.get('supplier')||'',annualQuantity:f.get('annualQuantity')||'',intendedUse:f.get('intendedUse')||'',fdsAvailable:f.get('fdsAvailable')==='Oui',fdsRevisionDate:f.get('fdsRevisionDate')||'',cmr:f.get('cmr')||'Non',hStatements:f.get('hStatements')||'',substitutionComment:f.get('substitutionComment')||'',substitutionConsidered:f.get('substitutionConsidered')||'À étudier',storage:f.get('storage')||'',collectiveProtection:f.get('collectiveProtection')||'',ppe:f.get('ppe')||'',preventionCategory:f.get('preventionCategory')||CHEMICAL_CATEGORIES[0],status:f.get('status')||'À instruire',reviewer:f.get('reviewer')||'',decisionDate:f.get('decisionDate')||'',comment:f.get('comment')||'',updated:now};if(isEdit){Object.assign(r,data);save();closeModal();chemicalTab='requests';render();toast('Demande mise à jour.');return}db.chemicalRequests.push({id:data.reference,created:now,...data});save();closeModal();chemicalTab='requests';render();toast('Demande d’acceptation enregistrée.');}}

function createChemicalProductFromRequest(id){const r=chemicalRequestsList().find(x=>x.id===id);if(!r)return;const p={name:r.productName,manufacturer:r.manufacturer,supplier:r.supplier,workUnits:r.unit?[r.unit]:[],annualQuantity:r.annualQuantity,usage:r.intendedUse,fdsAvailable:r.fdsAvailable,fdsRevisionDate:r.fdsRevisionDate,cmr:r.cmr,hStatements:r.hStatements,status:'Actif',notes:'Produit créé depuis la demande '+r.reference};const ref=chemicalSeqNext();p.id=ref;p.reference=ref;db.chemicalProducts.push(normalizeChemicalProduct(p));r.productId=ref;r.status='Produite';r.updated=new Date().toISOString();save();render();toast(ref+' ajouté à l’inventaire depuis '+r.reference+'.')}

function chemicalSettingsTab(){const c=normalizeChemicalSettings(db.chemicalSettings);return `<div class="grid two"><div class="card"><h2>Paramètres de suivi des FDS</h2><p class="chemical-settings-note">Ces paramètres pilotent les indicateurs de l’inventaire. Le seuil de 5 ans et l’alerte de 6 mois sont vos paramètres de gestion, modifiables selon votre règle interne.</p><form id="chemicalSettingsForm"><div class="field"><label>Ancienneté maximale d’une FDS (années)</label><input name="fdsAgeYears" type="number" min="1" max="20" value="${c.fdsAgeYears}"></div><div class="field"><label>Anticipation de l’alerte FDS (mois)</label><input name="alertMonths" type="number" min="1" max="24" value="${c.alertMonths}"></div><div class="form-actions"><button class="btn primary">Enregistrer les paramètres</button></div></form></div><div class="card"><h2>Organisation recommandée</h2><div class="chemical-step"><b>1. Inventorier</b><br>Produits utilisés ou stockés, produits hors CLP et agents chimiques émis.</div><div class="chemical-step"><b>2. Documenter</b><br>Conserver des FDS récentes et les relier aux produits concernés.</div><div class="chemical-step"><b>3. Relier au travail réel</b><br>Unités / zones de travail, tâches, quantités annuelles et conditions d’utilisation.</div><div class="chemical-step"><b>4. Prévenir</b><br>Privilégier suppression/substitution puis protections collectives, organisation, stockage, information/formation et EPI lorsque nécessaire.</div><div class="chemical-step"><b>5. Suivre</b><br>Tracer les actions, réévaluer lorsque les procédés ou conditions changent et intégrer les résultats pertinents au DUERP.</div><div class="chemical-source-card" style="margin-top:10px">Référence : <a href="https://www.inrs.fr/dam/inrs/CataloguePapier/ED/TI-ED-6485.pdf" target="_blank" rel="noopener">INRS ED 6485 — Démarche d’évaluation des risques chimiques</a></div></div></div>`}

function actionDisplayStatus(a){

 return a.status||'Proposée';
}

 const st=actionDisplayStatus(a);
 return `<span class="pill ${st==='Délai dépassé'?'red':''}">${esc(st)}</span>`;
}
function papActionType(a){
 if(a.actionType)return a.actionType;

 if(a.origin==='Fiche d’amélioration HSEÉ')return'Amélioration';
 if(a.origin==='Situation d’urgence')return'Sécurité';

       <div class="small muted" style="margin-top:5px">${esc(a.unit||'Unité non renseignée')}</div></td>
     <td><b>${esc(a.title)}</b><div class="small muted">${esc(a.reference||a.id)}</div></td>
     <td>${esc(papActionType(a))}</td><td>${statusPill(a.priority||'Normale')}</td><td>${esc(a.owner||'À définir')}</td>
     <td><div class="small">Créé : ${esc((a.created||'').slice(0,10)||'—')}</div><div class="small">Délai : ${esc(a.due||'N/C')}</div><div class="small">Fin : ${esc(a.endDate||'—')}</div></td>
     <td>${a.resources||a.budget?esc((a.resources||'')+(a.budget?` • ${a.budget} €`:'')):'—'}</td>

     <td class="stack"><button class="btn sm" onclick="editAction('${a.id}')">Modifier</button><button class="btn sm danger" onclick="deleteAction('${a.id}')">Supprimer</button></td>
   </tr>`;
 }).join('')}</tbody></table></div>`;
}

function papPage(el){
 const actions=papActions().slice().sort((a,b)=>{
   const na=Number((String(a.reference||'').match(/^PAP-(\d+)$/)||[])[1]||999999);
   const nb=Number((String(b.reference||'').match(/^PAP-(\d+)$/)||[])[1]||999999);
   return na-nb;
 });
 const open=actions.filter(a=>!['Clôturée','Annulée','Refusée'].includes(a.status)).length;
 const closed=actions.filter(a=>a.status==='Clôturée').length;
 const due=actions.filter(a=>a.due&&a.due<dateNow()&&!['Clôturée','Annulée','Refusée'].includes(a.status)).length;
 const origins=uniqSorted(actions.map(a=>a.origin));
 const units=uniqSorted(actions.map(a=>a.unit).filter(Boolean));
 const people=uniqSorted(actions.map(a=>a.owner).filter(Boolean));
 el.innerHTML=`<div class="pagehead"><div><h1>Programme Annuel de Prévention (PAPRIPACT)</h1><div class="muted">Plan d’action SST et suivi des actions associées.</div></div><div class="top-actions"><button class="btn hide-mobile" onclick="exportData()">⇩ Exporter (archiver)</button><button class="btn primary" onclick="openActionForm()">＋ Créer une action</button></div></div>
 <div class="toolbar" style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;align-items:end">
   <div><label class="small">Filtrer par origine</label><select id="papOrigin" onchange="filterPapActions()"><option value="">Toutes les origines</option>${origins.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select></div>
   <div><label class="small">Filtrer par priorité</label><select id="papPriority" onchange="filterPapActions()"><option value="">Toutes les priorités</option>${['Basse','Normale','Haute','Critique'].map(v=>`<option>${v}</option>`).join('')}</select></div>
   <div><label class="small">Filtrer par état d’avancement</label><select id="papStatus" onchange="filterPapActions()"><option value="">Tous les états</option>${['Proposée','À arbitrer','Approuvée','Reportée','Refusée','En cours','À vérifier','Clôturée','Délai dépassé','Annulée'].map(v=>`<option>${v}</option>`).join('')}</select></div>
   <div><label class="small">Filtrer par responsable</label><select id="papOwner" onchange="filterPapActions()"><option value="">Tous les responsables</option>${people.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select></div>
   <div><label class="small">Filtrer par unité</label><select id="papUnit" onchange="filterPapActions()"><option value="">Toutes les unités</option>${units.map(v=>`<option value="${esc(v)}">${esc(v)}</option>`).join('')}</select></div>
   <div><label class="small">Filtrer par délai de clôture</label><select id="papDue" onchange="filterPapActions()"><option value="">Tous les délais</option><option value="late">Délai dépassé</option><option value="soon">Bientôt à échéance</option><option value="ok">Délai OK</option><option value="none">Sans échéance</option></select></div>
 </div>
 <div class="toolbar" style="margin-top:-2px"><input id="papSearch" placeholder="Rechercher une action, une référence, une unité…" oninput="filterPapActions()"><span class="pill gray">${actions.length} action(s)</span><span class="pill blue">${closed} clôturée(s)</span><span class="pill ${due?'red':'gray'}">${due} délai(s) dépassé(s)</span></div>
 <div id="papTable">${papActionTable(actions)}</div>`
}
function filterPapActions(){
 const q=(document.getElementById('papSearch')?.value||'').toLowerCase();
 const s=document.getElementById('papStatus')?.value||'';
 const o=document.getElementById('papOrigin')?.value||'';
 const p=document.getElementById('papPriority')?.value||'';
 const owner=document.getElementById('papOwner')?.value||'';
 const unit=document.getElementById('papUnit')?.value||'';
 const dueFilter=document.getElementById('papDue')?.value||'';
 const arr=papActions().filter(a=>{
   const display=actionDisplayStatus(a);
   const search=(a.title+' '+(a.reference||'')+' '+(a.id||'')+' '+(a.origin||'')+' '+(a.owner||'')+' '+(a.unit||'')+' '+(a.site||'')).toLowerCase();
   let dueOk=true;
   if(dueFilter==='late')dueOk=display==='Délai dépassé';
   else if(dueFilter==='soon'){const d=a.due?new Date(a.due+'T00:00:00'):null,days=d?Math.ceil((d-new Date(dateNow()+'T00:00:00'))/86400000):999999;dueOk=days>=0&&days<=30&&!['Clôturée','Annulée','Refusée'].includes(a.status)}
   else if(dueFilter==='ok')dueOk=!!a.due&&display!=='Délai dépassé'&&!['Clôturée','Annulée','Refusée'].includes(a.status);
   else if(dueFilter==='none')dueOk=!a.due;
   return search.includes(q)&&(!s||display===s||a.status===s)&&(!o||a.origin===o)&&(!p||a.priority===p)&&(!owner||a.owner===owner)&&(!unit||a.unit===unit)&&dueOk;
 });
 document.getElementById('papTable').innerHTML=papActionTable(arr);
}

 <form id="actionForm"><div class="formgrid">
   <div class="field"><label>N° de l’action</label><input name="reference" value="${esc(ref)}" readonly></div>

   <div class="field"><label>Début / création</label><input name="startDate" type="date" value="${dateNow()}"></div>
   <div class="field"><label>Délai / échéance</label><input name="due" type="date"></div>
   <div class="field"><label>Date de fin effective</label><input name="endDate" type="date"></div>
   <div class="field"><label>Ressources (€)</label><input name="budget" type="number" min="0" step="0.01"></div>
   <div class="field"><label>Ressources / moyens</label><input name="resources" placeholder="Ex. Maintenance, prestataire…"></div>
   <div class="field"><label>Statut ISO 45001</label><select name="status"><option selected>À traiter</option><option>En cours</option><option>À vérifier</option><option>Clôturée</option><option>Reportée</option><option>Refusée</option><option>Annulée</option></select></div>
   <div class="field span2"><label>Indicateur / résultat attendu</label><input name="indicator"></div>

function vgpAutoIcon(name,code){const s=(String(name||'')+' '+String(code||'')).toLowerCase();if(/electric|elec|q18/.test(s))return'⚡';if(/thermo|q19/.test(s))return'🌡️';if(/levage|pont|grue|chariot|potence/.test(s))return'🏗️';if(/porte|portail/.test(s))return'🚪';if(/incend|extinct|sprink/.test(s))return'🔥';if(/ascenseur|monte-charge/.test(s))return'🛗';if(/gaz|chaudiere|chaufferie/.test(s))return'♨️';if(/échelle|echelle/.test(s))return'🪜';if(/électricité|electricite/.test(s))return'⚡';return'🛠️'}

function importData(){
 let f=document.getElementById('importFile')?.files[0];if(!f)return alert('Choisissez un fichier de sauvegarde JSON.');
 let r=new FileReader();r.onload=()=>{
  try{
   let x=JSON.parse(r.result);
   if(!Array.isArray(x.items)||!Array.isArray(x.actions))throw 0;
   const tmp={...x,workUnits:Array.isArray(x.workUnits)?x.workUnits:[],personnel:Array.isArray(x.personnel)?x.personnel:[],papSeq:Number(x.papSeq)||1,suSeqByYear:x.suSeqByYear&&typeof x.suSeqByYear==='object'?x.suSeqByYear:{},accidents:Array.isArray(x.accidents)?x.accidents:[],analysesAT:Array.isArray(x.analysesAT)?x.analysesAT:[],atSeqByYear:x.atSeqByYear&&typeof x.atSeqByYear==='object'?x.atSeqByYear:{},analysisSeq:Number(x.analysisSeq)||1};
   if(!Array.isArray(tmp.vgpReports))tmp.vgpReports=[];if(!Array.isArray(tmp.vgpFindings))tmp.vgpFindings=[];
   const units=uniqSorted(tmp.workUnits),people=uniqSorted(tmp.personnel);
   tmp.items.forEach(i=>{normalizeDuerpItem(i);[i.workUnit,i.service].forEach(v=>{if(v&&!units.includes(v))units.push(v)});[i.author,i.owner].forEach(v=>{if(v&&!people.includes(v))people.push(v)})});
   tmp.actions.forEach(a=>{if(a.owner&&!people.includes(a.owner))people.push(a.owner);if(a.unit&&!units.includes(a.unit))units.push(a.unit)});
   tmp.workUnits=uniqSorted(units);tmp.personnel=uniqSorted(people);
   if(confirm('Remplacer les données actuelles par cette sauvegarde ?')){
    db={items:tmp.items.map(normalizeDuerpItem),actions:tmp.actions,vgpReports:tmp.vgpReports,vgpFindings:tmp.vgpFindings,vgpTypes:Array.isArray(tmp.vgpTypes)&&tmp.vgpTypes.length?tmp.vgpTypes:defaultVgpTypes(),duerpConfig:normalizeDuerpConfig(tmp.duerpConfig),duerpExpandedUnits:(tmp.duerpExpandedUnits&&typeof tmp.duerpExpandedUnits==='object')?tmp.duerpExpandedUnits:{},chemicalProducts:Array.isArray(tmp.chemicalProducts)?tmp.chemicalProducts.map(normalizeChemicalProduct):[],chemicalRequests:Array.isArray(tmp.chemicalRequests)?tmp.chemicalRequests:[],chemicalSettings:normalizeChemicalSettings(tmp.chemicalSettings),chemicalSeq:Math.max(1,Number(tmp.chemicalSeq)||1),chemicalRequestSeq:Math.max(1,Number(tmp.chemicalRequestSeq)||1),accidents:(tmp.accidents||[]).map(normalizeAccidentRecord),analysesAT:(tmp.analysesAT||[]).map(normalizeAccidentAnalysis),atSeqByYear:tmp.atSeqByYear,analysisSeq:tmp.analysisSeq,workUnits:tmp.workUnits,personnel:tmp.personnel,seq:Number(tmp.seq)||1,papSeq:tmp.papSeq,suSeqByYear:tmp.suSeqByYear};
    let pMax=0;db.chemicalProducts.forEach(p=>{const m=String(p.reference||p.id||'').match(/^CHIM-(\d+)$/);if(m)pMax=Math.max(pMax,Number(m[1]))});db.chemicalSeq=Math.max(db.chemicalSeq,pMax+1);let rMax=0;db.chemicalRequests.forEach(r=>{const m=String(r.reference||r.id||'').match(/^DAC-(\d+)$/);if(m)rMax=Math.max(rMax,Number(m[1]))});db.chemicalRequestSeq=Math.max(db.chemicalRequestSeq,rMax+1);
    // Rejoue les migrations de références sur les données importées.
    db.actions.forEach(a=>{if(/DUERP|Fiche d’amélioration|Situation d’urgence|Situation dangereuse/i.test(String(a.origin||'')))a.papripact=true});
    let maxPap=Math.max(0,Number(db.papSeq)-1);db.actions.filter(a=>a.papripact===true).slice().sort((a,b)=>String(a.created||'').localeCompare(String(b.created||''))).forEach(a=>{const m=String(a.reference||'').match(/^PAP-(\d+)$/);if(m)maxPap=Math.max(maxPap,Number(m[1]));else{maxPap++;a.reference=`PAP-${String(maxPap).padStart(3,'0')}`;a.id='PAP-'+String(maxPap).padStart(3,'0');}});db.papSeq=Math.max(Number(db.papSeq)||1,maxPap+1);
    save();adminTab='data';render();toast('Sauvegarde importée.');
   }
  }catch(e){alert('Fichier de sauvegarde invalide.');}
 };r.readAsText(f)
}
